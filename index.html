<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcript Bot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,0.1); padding: 40px; width: 420px; max-width: 90vw; }
  h1 { font-size: 24px; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #333; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  input:focus { outline: none; border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74,158,255,0.15); }
  button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; background: #4a9eff; color: #fff; transition: background 0.2s; }
  button:hover { background: #3a8eef; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
  .status.ok { display: block; background: #eafbe7; color: #1a7f37; }
  .status.err { display: block; background: #ffeef0; color: #cf222e; }
  .status.info { display: block; background: #ddf4ff; color: #0969da; }
  .hidden { display: none; }
  .setup-link { text-align: center; margin-top: 12px; font-size: 12px; color: #888; cursor: pointer; }
  .setup-link:hover { color: #4a9eff; }
</style>
</head>
<body>
<div class="card">
  <h1>Transcript Bot</h1>
  <p class="subtitle">Bilibili / YouTube video transcription</p>

  <!-- Login Form -->
  <div id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
    <button onclick="doLogin()">Login</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <!-- URL Form (shown after login) -->
  <div id="urlForm" class="hidden">
    <label for="videoUrl">Video URL (Bilibili or YouTube)</label>
    <input type="url" id="videoUrl" placeholder="https://www.bilibili.com/video/BV...">
    <button id="submitBtn" onclick="submitUrl()">Submit</button>
    <div id="urlStatus" class="status"></div>
    <div class="setup-link" onclick="showPanel('setupForm')">Settings</div>
  </div>

  <!-- Setup Form (PAT config) -->
  <div id="setupForm" class="hidden">
    <label for="pat">GitHub Personal Access Token</label>
    <input type="password" id="pat" placeholder="ghp_...">
    <p style="font-size:12px;color:#888;margin:-10px 0 16px">Only stored in this browser's localStorage</p>
    <button onclick="savePat()">Save</button>
    <div class="setup-link" onclick="showPanel('urlForm')">Back</div>
  </div>
</div>

<script>
const REPO_OWNER = "aniesway01";
const REPO_NAME = "transcript-bot";
const VALID_USER = "shawnch";
const VALID_HASH = "b9ac10cf589815b34c4f4cf7568a229010a38a71a8e8d7988b9adf0451ae85e0";

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

const PANELS = ["loginForm", "urlForm", "setupForm"];
function showPanel(id) {
  PANELS.forEach(p => document.getElementById(p).classList.toggle("hidden", p !== id));
}

async function doLogin() {
  const user = document.getElementById("username").value.trim().toLowerCase();
  const pass = document.getElementById("password").value;
  const hash = await sha256(pass);
  const el = document.getElementById("loginStatus");
  if (user === VALID_USER && hash === VALID_HASH) {
    sessionStorage.setItem("authed", "1");
    showPanel(localStorage.getItem("gh_pat") ? "urlForm" : "setupForm");
    el.className = "status";
  } else {
    el.className = "status err";
    el.textContent = "Invalid username or password";
  }
}

function savePat() {
  const pat = document.getElementById("pat").value.trim();
  if (!pat) return;
  localStorage.setItem("gh_pat", pat);
  showPanel("urlForm");
}

async function submitUrl() {
  const url = document.getElementById("videoUrl").value.trim();
  const el = document.getElementById("urlStatus");
  const btn = document.getElementById("submitBtn");

  try {
    const host = new URL(url).hostname;
    const allowed = ["www.bilibili.com", "bilibili.com", "m.bilibili.com", "www.youtube.com", "youtube.com", "youtu.be"];
    if (!allowed.includes(host)) throw new Error();
  } catch {
    el.className = "status err";
    el.textContent = "Please enter a valid Bilibili or YouTube URL";
    return;
  }

  const pat = localStorage.getItem("gh_pat");
  if (!pat) {
    showPanel("setupForm");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Submitting...";
  el.className = "status info";
  el.textContent = "Sending request...";

  try {
    const resp = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/dispatches`, {
      method: "POST",
      headers: {
        "Accept": "application/vnd.github+json",
        "Authorization": `Bearer ${pat}`,
        "X-GitHub-Api-Version": "2022-11-28",
      },
      body: JSON.stringify({
        event_type: "transcribe",
        client_payload: { url: url }
      }),
    });

    if (resp.status === 204) {
      el.className = "status ok";
      el.textContent = "Submitted! The transcript will be emailed to you in a few minutes.";
      document.getElementById("videoUrl").value = "";
    } else if (resp.status === 401) {
      el.className = "status err";
      el.textContent = "GitHub token expired. Please update in Settings.";
    } else {
      const body = await resp.text();
      el.className = "status err";
      el.textContent = `Error ${resp.status}: ${body}`;
    }
  } catch (e) {
    el.className = "status err";
    el.textContent = "Network error: " + e.message;
  }

  btn.disabled = false;
  btn.textContent = "Submit";
}

if (sessionStorage.getItem("authed") === "1") {
  showPanel(localStorage.getItem("gh_pat") ? "urlForm" : "setupForm");
}
</script>
</body>
</html>
